<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>

    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <script>
      // Dark is the default, applied before first paint so there is no flash of
      // the light theme. `useTheme` owns the attribute afterwards.
      try {
        var t = localStorage.getItem('theme') || 'dark';
        if (t !== 'system') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
    <meta name="theme-color" content="#ece4e2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#ece4e2" media="(prefers-color-scheme: dark)" />

    <!--
      The adapter substitutes these three:
        inertia_head — the Vite tags (dev server, or hashed build assets)
        inertia      — the page object, as a JSON script tag
        root_id      — the id the client mounts on

      Nothing else in this file is dynamic. Every screen is React.
    -->
    {{ inertia_head }}
  </head>
  <body class="h-full antialiased">
    <div id="{{ root_id }}" class="min-h-full"></div>
    {{ inertia }}
  </body>
</html>
